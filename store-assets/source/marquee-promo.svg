<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">RS Levels Capture marquee promotional tile</title>
  <desc id="desc">A dark blue promotional graphic for moving RocketScooter chart levels into TradingView and other supported platforms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#102a47"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".42" r=".58">
      <stop offset="0" stop-color="#2874a8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2874a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#background)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>
  <g transform="translate(72 54)">
    <rect width="76" height="76" rx="19" fill="#0b1728" stroke="#d9f2ff" stroke-opacity=".4" stroke-width="3"/>
    <text x="38" y="51" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-2" text-anchor="middle">RS</text>
  </g>
  <text x="170" y="99" fill="#9acced" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2">RS LEVELS CAPTURE</text>
  <text x="72" y="224" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700">RocketScooter levels,</text>
  <text x="72" y="290" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700">on the platform you trade.</text>
  <text x="72" y="360" fill="#b8cbe0" font-family="Segoe UI,Arial,sans-serif" font-size="24">Send to TradingView in a few clicks—no manual level entry.</text>
  <text x="72" y="394" fill="#b8cbe0" font-family="Segoe UI,Arial,sans-serif" font-size="24">Or use the same data with your preferred supported platform.</text>
  <g fill="#eaf6ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">
    <circle cx="80" cy="476" r="5" fill="#62d9ff"/><text x="100" y="483">Easy TradingView handoff</text>
    <circle cx="382" cy="476" r="5" fill="#62d9ff"/><text x="402" y="483">One capture. Every supported platform.</text>
  </g>
  <rect x="1000" y="40" width="352" height="480" rx="22" fill="#02070d" fill-opacity=".7" stroke="#9bdcff" stroke-opacity=".26" stroke-width="2"/>
</svg>
