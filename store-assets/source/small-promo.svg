<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">RS Levels Capture promotional tile</title>
  <desc id="desc">RS Levels Capture branding with the message Your levels, your platform.</desc>
  <defs>
    <radialGradient id="backdrop" cx=".5" cy=".44" r=".72">
      <stop offset="0" stop-color="#18395d"/>
      <stop offset=".58" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#backdrop)"/>
  <rect x="36" y="58" width="164" height="164" rx="40" fill="url(#surface)" stroke="#d9f2ff" stroke-opacity=".42" stroke-width="4"/>
  <text x="118" y="162" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="-4" text-anchor="middle">RS</text>
  <text x="218" y="91" fill="#9acced" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">RS LEVELS CAPTURE</text>
  <text x="218" y="137" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">YOUR LEVELS.</text>
  <text x="218" y="173" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">YOUR PLATFORM.</text>
</svg>
