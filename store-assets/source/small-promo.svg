<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">RS Levels Capture promotional tile</title>
  <desc id="desc">RS monogram on a dark blue background.</desc>
  <defs>
    <radialGradient id="backdrop" cx=".5" cy=".44" r=".72">
      <stop offset="0" stop-color="#18395d"/>
      <stop offset=".58" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#backdrop)"/>
  <rect x="122" y="42" width="196" height="196" rx="48" fill="url(#surface)" stroke="#d9f2ff" stroke-opacity=".42" stroke-width="4"/>
  <text x="220" y="170" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="88" font-weight="700" letter-spacing="-5" text-anchor="middle">RS</text>
</svg>
