<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">RS Levels Capture store screenshot background</title>
  <desc id="desc">A dark blue release graphic describing local-first, opt-in display-level capture.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#102a47"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".42" r=".62">
      <stop offset="0" stop-color="#2874a8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2874a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <g transform="translate(72 64)">
    <rect width="82" height="82" rx="20" fill="#0b1728" stroke="#d9f2ff" stroke-opacity=".34" stroke-width="3"/>
    <path d="M18 26H64M18 41H64M18 56H64" fill="none" stroke="#62d9ff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="26" r="7" fill="#ffd166" stroke="#0b1728" stroke-width="3"/>
    <circle cx="51" cy="41" r="7" fill="#ffd166" stroke="#0b1728" stroke-width="3"/>
    <circle cx="41" cy="56" r="7" fill="#ffd166" stroke="#0b1728" stroke-width="3"/>
  </g>
  <text x="178" y="94" fill="#9acced" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.4">LOCAL-FIRST  •  OPT-IN  •  DISPLAY-ONLY</text>
  <text x="72" y="234" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700">Capture the levels</text>
  <text x="72" y="304" fill="#f8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700">you already use.</text>
  <text x="72" y="370" fill="#b8cbe0" font-family="Segoe UI,Arial,sans-serif" font-size="25">Move RocketScooter display data into your local</text>
  <text x="72" y="405" fill="#b8cbe0" font-family="Segoe UI,Arial,sans-serif" font-size="25">RS Levels tools—under your control.</text>
  <g fill="#eaf6ff" font-family="Segoe UI,Arial,sans-serif" font-size="22">
    <circle cx="82" cy="490" r="6" fill="#62d9ff"/><text x="106" y="498">Capture stays off until you opt in</text>
    <circle cx="82" cy="552" r="6" fill="#62d9ff"/><text x="106" y="560">Localhost is the default destination</text>
    <circle cx="82" cy="614" r="6" fill="#62d9ff"/><text x="106" y="622">Copy or send a validated TradingView payload</text>
  </g>
  <text x="72" y="724" fill="#ffd166" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">RS LEVELS CAPTURE</text>
  <rect x="850" y="24" width="390" height="752" rx="20" fill="#02070d" fill-opacity=".68" stroke="#9bdcff" stroke-opacity=".26" stroke-width="2"/>
</svg>
